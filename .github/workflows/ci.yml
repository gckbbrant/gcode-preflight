name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify the locked MoonBit toolchain
        run: |
          version="$(tr -d '\r\n' < moonbit-version)"
          expected_moon="${version%%+*}"
          expected_commit="${version##*+}"
          actual="$(moon version --all)"
          printf '%s\n' "$actual"
          grep -Fq "moon ${expected_moon} (${expected_commit} " <<< "$actual"
      - name: Run acceptance checks and collect evidence
        run: python3 scripts/acceptance_check.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcode-preflight-acceptance
          path: _build/acceptance/
          if-no-files-found: warn
          retention-days: 14
